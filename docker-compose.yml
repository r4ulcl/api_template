version: '3.8'

services:
  # ----------------------------------------------------------
  # MySQL Database Service
  # ----------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    env_file: .env
    ports:
      - "3306:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql

  # ----------------------------------------------------------
  # Go Application Service
  # ----------------------------------------------------------
  app:
    build: .
    container_name: go_app
    restart: always
    env_file: .env
    depends_on:
      - db
    ports:
      - "7080:8080"
