version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    env_file: .env
    ports:
      - "3306:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql

  app:
    build:
      context: .
      target: runner
    container_name: go_app
    restart: always
    env_file: .env
    depends_on:
      - db
    volumes:
      - ./example_tables/:/example_tables/
    ports:
      - "7080:8080"
      