basePath: /
definitions:
  controllers.paginatedResponse:
    properties:
      data: {}
      links:
        $ref: '#/definitions/controllers.paginationLinks'
      meta:
        $ref: '#/definitions/controllers.paginationMeta'
    type: object
  controllers.paginationLinks:
    properties:
      first:
        type: string
      last:
        type: string
      next:
        type: string
      prev:
        type: string
      self:
        type: string
    type: object
  controllers.paginationMeta:
    properties:
      current_page:
        type: integer
      page_size:
        type: integer
      total_items:
        type: integer
      total_pages:
        type: integer
    type: object
  models.APIKeyResponse:
    properties:
      api_key:
        type: string
      created_at:
        type: string
      description:
        type: string
      enabled:
        type: boolean
      expiracy:
        type: string
      last_used:
        type: string
    type: object
  models.CreateAPIKeyRequest:
    properties:
      description:
        description: Description is a human readable label to identify the key's intent.
        type: string
      expiracy:
        description: Expiracy is an optional UTC timestamp when the key becomes invalid.
        type: string
    required:
    - description
    type: object
  models.ErrorResponse:
    properties:
      error:
        description: Error contains a descriptive error message.
        type: string
    type: object
  models.JWTResponse:
    properties:
      token:
        description: Token is the JWT token assigned to the authenticated user.
        type: string
    type: object
  models.LoginRequest:
    properties:
      password:
        description: Password is the user's password used for authentication.
        type: string
      totp_code:
        description: TotpCode is required when Time-based OTP is enabled for the account.
        type: string
      username:
        description: Username is the unique identifier for the user attempting to
          log in.
        type: string
    required:
    - password
    - username
    type: object
  models.Role:
    enum:
    - user
    - reviewer
    - admin
    - '*'
    type: string
    x-enum-varnames:
    - UserRole
    - ReviewerRole
    - AdminRole
    - DefaultRoleWhitelist
  models.UpdateUser:
    properties:
      created_at:
        description: Audit
        type: string
      created_by:
        type: string
      edited_by:
        type: string
      email:
        description: Contact
        type: string
      email_verified:
        type: boolean
      last_update:
        type: string
      new_password:
        example: new_password
        type: string
      password:
        description: Authentication
        type: string
      role:
        allOf:
        - $ref: '#/definitions/models.Role'
        description: Authorization
      totp_code:
        type: string
      totp_enabled:
        type: boolean
      totp_reset_secret:
        type: boolean
      totp_secret:
        type: string
      username:
        description: Primary key
        type: string
    type: object
  models.User:
    properties:
      created_at:
        description: Audit
        type: string
      created_by:
        type: string
      edited_by:
        type: string
      email:
        description: Contact
        type: string
      email_verified:
        type: boolean
      last_update:
        type: string
      password:
        description: Authentication
        type: string
      role:
        allOf:
        - $ref: '#/definitions/models.Role'
        description: Authorization
      totp_enabled:
        type: boolean
      username:
        description: Primary key
        type: string
    type: object
info:
  contact:
    email: support@yourdomain.com
    name: API Support
    url: http://yourdomain.com/support
  description: This is a sample API for managing administrative resources like users,
    servers, employees, groups, etc.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://yourdomain.com/terms/
  title: Admin API Documentation
  version: "1.0"
paths:
  /{resource}:
    get:
      consumes:
      - application/json
      description: Retrieves records of a given resource, supporting complex filters,
        sorting, and pagination.
      parameters:
      - description: Resource name (e.g., users, items)
        in: path
        name: resource
        required: true
        type: string
      - description: Page number (default is 1)
        in: query
        name: page
        type: integer
      - description: Items per page (default is 1000)
        in: query
        name: page_size
        type: integer
      - description: Comma-separated sort fields, prefix with '-' for DESC
        in: query
        name: sort
        type: string
      - description: Filter parameters of the form filter[field][op]=value (repeatable)
        in: query
        name: filter
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Paginated list of records
          schema:
            $ref: '#/definitions/controllers.paginatedResponse'
        "400":
          description: Invalid query parameters
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get a paginated list of records
      tags:
      - user
      - admin
    post:
      consumes:
      - application/json
      description: Accepts either a single JSON object or an array of JSON objects
        for the given resource.
      parameters:
      - description: Resource name (e.g., users, items)
        in: path
        name: resource
        required: true
        type: string
      - description: If true, for single object duplicates update instead of error
        in: query
        name: overwrite
        type: boolean
      - description: A single JSON object or an array of JSON objects matching model
          schema
        in: body
        name: payload
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: The created record, or list of created records
          schema:
            type: object
        "400":
          description: Bad request (invalid JSON or missing fields)
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "409":
          description: Conflict (duplicate key and overwrite=false) for single object
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Create one or more records
      tags:
      - admin
  /{resource}/{id}:
    delete:
      consumes:
      - application/json
      description: Deletes a resource identified by its primary key. Supports composite
        keys via hyphen-separated composite format.
      parameters:
      - description: Resource name (e.g., users, items)
        in: path
        name: resource
        required: true
        type: string
      - description: Primary key (or hyphen-separated composite key)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Success message
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Record not found or access denied.
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Delete a record
      tags:
      - admin
    get:
      consumes:
      - application/json
      description: Fetches a single resource by its ID. Supports composite keys via
        hyphen-separated format.
      parameters:
      - description: Resource name (e.g., users, items)
        in: path
        name: resource
        required: true
        type: string
      - description: Primary key (or hyphen-separated composite key)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: The requested record
          schema:
            type: object
        "404":
          description: Record not found or access denied.
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get a record by ID
      tags:
      - user
      - admin
    put:
      consumes:
      - application/json
      description: Accepts a JSON payload to update an existing resource. The `id`
        in the path is used to locate the record.
      parameters:
      - description: Resource name (e.g., users, items)
        in: path
        name: resource
        required: true
        type: string
      - description: Primary key (or hyphen-separated composite key)
        in: path
        name: id
        required: true
        type: string
      - description: JSON object with fields to update. Non-zero fields will be updated
        in: body
        name: payload
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: The updated record
          schema:
            type: object
        "400":
          description: Invalid input JSON
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Record not found or access denied.
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Update a record
      tags:
      - admin
  /login:
    post:
      consumes:
      - application/json
      description: Accepts JSON credentials (username + password) and returns a token
        if valid.
      parameters:
      - description: Username and password
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/models.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: JWT token returned
          schema:
            $ref: '#/definitions/models.JWTResponse'
        "400":
          description: Missing or invalid fields
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized (invalid credentials)
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Authenticate a user and issue a JWT (POST)
      tags:
      - auth
    put:
      consumes:
      - application/json
      description: Accepts JWT using PUT. Returns a new JWT if valid.
      produces:
      - application/json
      responses:
        "200":
          description: JWT token returned
          schema:
            $ref: '#/definitions/models.JWTResponse'
        "400":
          description: Missing or invalid fields
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized (invalid credentials)
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Renew token via PUT
      tags:
      - auth
  /me:
    get:
      consumes:
      - application/json
      description: Get userinformation
      produces:
      - application/json
      responses:
        "200":
          description: JWT token returned
          schema:
            $ref: '#/definitions/models.JWTResponse'
        "400":
          description: Missing or invalid fields
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized (invalid credentials)
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Authenticate user via query params (GET)
      tags:
      - user
    patch:
      consumes:
      - application/json
      description: Allows the authenticated user to change email and/or password.
        To change password, both current and new passwords are required. Mint a TOTP
        secret with `totp_reset_secret` and include `totp_code` when enabling or disabling
        MFA.
      parameters:
      - description: Fields to update
        in: body
        name: update
        required: true
        schema:
          $ref: '#/definitions/models.UpdateUser'
      produces:
      - application/json
      responses:
        "200":
          description: Updated user info
          schema:
            $ref: '#/definitions/models.User'
        "400":
          description: Bad request (invalid/missing fields)
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized (invalid current password or token)
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Update current user's profile
      tags:
      - user
  /me/api-key:
    post:
      consumes:
      - application/json
      description: Allows the authenticated user to mint a new API key after providing
        a description and optional expiration timestamp.
      parameters:
      - description: API key details
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/models.CreateAPIKeyRequest'
      produces:
      - application/json
      responses:
        "201":
          description: API key metadata (token omitted)
          schema:
            $ref: '#/definitions/models.APIKeyResponse'
        "400":
          description: Bad request (invalid input)
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized (invalid or missing token)
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "409":
          description: Duplicate API key (unexpected conflict)
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Generate API key
      tags:
      - user
      - auth
  /me/api-key/{apiKey}:
    delete:
      consumes:
      - application/json
      description: Disables a specific API key for the authenticated user so it can
        no longer be used.
      parameters:
      - description: API key to revoke
        in: path
        name: apiKey
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 'revoked: true'
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: Bad request (missing apiKey)
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized (invalid or missing token)
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: API key not found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Revoke API key
      tags:
      - user
      - auth
  /register:
    post:
      consumes:
      - application/json
      description: Accepts JSON input with username and password to create a new user.
      parameters:
      - description: User registration data
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/models.User'
      produces:
      - application/json
      responses:
        "201":
          description: User successfully registered
          schema:
            $ref: '#/definitions/models.User'
        "400":
          description: Invalid input JSON or missing fields
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "409":
          description: User already exists
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Register a new user account
      tags:
      - auth
schemes:
- http
- https
security:
- ApiKeyAuth: []
securityDefinitions:
  ApiKeyAuth:
    description: JWT to login
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
